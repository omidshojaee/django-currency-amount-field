[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-currency-field"
version = "0.1.0"
description = "A Django DecimalField subclass for monetary amounts with a comma-grouping admin widget and an optional paired currency-code field."
readme = "README.md"
license = "MIT"
authors = [{ name = "Omid Shojaee", email = "omid.shojaee@gmail.com" }]
requires-python = ">=3.10"
keywords = ["django", "currency", "money", "decimal", "admin", "form-field"]
dependencies = [
    "Django>=5.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-django>=4"]

[project.urls]
Homepage = "https://github.com/omidshojaee/django-currency-field"
Repository = "https://github.com/omidshojaee/django-currency-field"
Issues = "https://github.com/omidshojaee/django-currency-field/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
currency_field = ["static/currency_field/js/*.js", "static/currency_field/css/*.css"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["src", "."]
