name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          pip install "django~=${{ matrix.django-version }}.0"
          pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test the widget script
        run: node --test tests/js/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Check the wheel carries the script, the stylesheet and the license
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needle in (
              "currency_amount_field/static/currency_amount_field/js/currency-widget.js",
              "currency_amount_field/static/currency_amount_field/css/currency-widget.css",
              "licenses/LICENSE",
          ):
              assert any(n.endswith(needle) for n in names), f"missing from wheel: {needle}"
          EOF
